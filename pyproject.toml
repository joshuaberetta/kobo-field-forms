[project]
name = "kobo-field-forms"
version = "0.1.0"
description = "Paper forms for KoboToolbox: print from a deployed form, scan, read, submit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "opencv-python-headless>=4.10,<5",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "segno>=1.6.6",
    "typst>=0.15.0",
    "uvicorn>=0.54.0",
    "zxing-cpp>=3.1.1",
]

[project.scripts]
kff = "kff.cli:main"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: hits a real KoboToolbox server (needs KOBO_TOKEN)",
]
addopts = "-m 'not live'"
timeout = 60
filterwarnings = [
    # starlette's TestClient on httpx; harmless for tests.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
