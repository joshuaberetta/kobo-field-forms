# docker compose up                 the web interface on 127.0.0.1:8765
# docker compose --profile vlm up   plus a local vision model for handwritten text
#                                   (llama.cpp + Gemma 4 E4B, weights in /opt/models)
# docker compose run --rm kff kff e2e   the end-to-end test
#
# KOBO_TOKEN comes from the environment of `docker compose`; it is never written into
# the image or a file here.
services:
  kff:
    build: .
    image: kff:local
    environment:
      KOBO_TOKEN: ${KOBO_TOKEN:-}
      KOBO_BASE_URL: ${KOBO_BASE_URL:-global}
      KOBO_ALLOW_HTTP: ${KOBO_ALLOW_HTTP:-false}
      KFF_VLM_URL: ${KFF_VLM_URL:-}
      KFF_VLM_MODEL: ${KFF_VLM_MODEL:-local}
    volumes:
      - kff-data:/data
      - ./out:/app/out
    # Published on the host's loopback only: reach it through an SSH tunnel.
    ports:
      - "127.0.0.1:8765:8765"

  vlm:
    profiles: [vlm]
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - /opt/models:/models:ro
    # Loopback only, so the droplet can check it's up; kff reaches it as http://vlm:8080.
    ports:
      - "127.0.0.1:8081:8080"
    # A list, not a string: compose would split a string like a shell and strip the
    # JSON's quotes.
    command:
      - -m
      - /models/${VLM_MODEL_FILE:-gemma-4-E4B-it-Q4_0.gguf}
      - --mmproj
      - /models/${VLM_MMPROJ_FILE:-mmproj-gemma-4-E4B-it-Q8_0.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "8192"
      - -t
      - "${VLM_THREADS:-4}"
      - --chat-template-kwargs
      - '{"enable_thinking":false}'

volumes:
  kff-data:
